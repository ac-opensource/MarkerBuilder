plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def mapsApiKey = providers.gradleProperty("MAPS_API_KEY")
        .orElse(System.getenv("MAPS_API_KEY") ?: localProperties.getProperty("MAPS_API_KEY", ""))
        .get()

def escapedMapsApiKey = mapsApiKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace 'com.aconcepcion.markerbuilder'
    compileSdk 36

    defaultConfig {
        applicationId "com.aconcepcion.markerbuilder"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField "String", "MAPS_API_KEY", "\"${escapedMapsApiKey}\""
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    implementation project(":geofencemarkerbuilder")

    implementation platform("androidx.compose:compose-bom:2026.03.01")
    androidTestImplementation platform("androidx.compose:compose-bom:2026.03.01")

    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "com.google.android.material:material:1.13.0"
    implementation "com.google.maps.android:maps-compose:8.3.0"

    debugImplementation "androidx.compose.ui:ui-test-manifest"
    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}
